
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # Reviewed Level 1 evidence: train vocabulary, validation cohort and
        # two image contact sheets (each below 1.5 MB); no model/data binaries.
        exclude: ^reports/level1/(zero-shot-reference-v1/(train-seen-triplets|validation-cohort)\.json|submission/cases/(hit|miss)-contact-sheet\.png)$
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 23.10.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - --remove-all-unused-imports
          - --in-place
          - --exclude=__init__.py

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        # Preserve exact source hashes of the frozen Level 1 evaluations.
        # These four files pass Black/Ruff; re-enable import sorting when a
        # new evaluator version and its reports replace this frozen version.
        exclude: ^(scripts/evaluate_level1\.py|src/evaluation/gat\.py|tools/(check_reference_predcls|level1_zero_shot)\.py)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
