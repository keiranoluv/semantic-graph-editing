<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MagicBrush · Kiểm tra 20 cặp validation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:#172e37;font:16px/1.5 "Inter",system-ui,sans-serif}
main,nav{max-width:1200px;margin:auto;padding:16px 24px}header{background:#15333b;color:white}
nav,.pair{display:grid;gap:18px;align-items:center}nav{grid-template-columns:auto 1fr auto auto}
select,button{font:inherit;padding:7px;border:1px solid #93a6a4;border-radius:5px;max-width:100%}button{cursor:pointer}
.pair{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}section,figure,.graph{margin:0;background:white;border:1px solid #ccd8d4;border-radius:8px;padding:16px}
figure{padding:10px}img{width:100%;height:clamp(220px,32vh,420px);object-fit:contain;display:block;background:#f1f3ef;cursor:zoom-in}
dialog{width:min(96vw,1200px);padding:8px;border:0;border-radius:6px}dialog img{height:80vh;cursor:default}dialog::backdrop{background:#10282dcc}
figcaption,h3{font-weight:650;margin:0 0 8px}h1{line-height:1.2;margin:6px 0 18px}h2{margin:28px 0 8px}small,em{color:#376556}
ul,ol{padding-left:1.4em}li{margin:6px 0;overflow-wrap:anywhere}svg{width:100%;max-height:520px}
svg text{text-anchor:middle;font:12px monospace;fill:#132f34}svg .node-name{font:bold 12px system-ui;paint-order:stroke;stroke:white;stroke-width:3px}
@media(max-width:720px){.pair{grid-template-columns:1fr}nav{gap:8px;grid-template-columns:1fr auto auto}nav label{grid-column:1/-1}main,nav{padding:12px}}
</style>
<header><nav><label for="pick">Mẫu MagicBrush</label><select id="pick"><!--options--></select><button id="prev">← Trước</button><button id="next">Sau →</button></nav></header>
<main><!--cards--></main><dialog id="zoom"><button id="close">Đóng</button><img id="large" alt=""></dialog>
<script>
const cards=Array.from(document.querySelectorAll('article')),pick=document.querySelector('#pick'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
function render(){const nr=Number(location.hash.slice(1));const i=Number.isInteger(nr)&&nr>=1&&nr<=cards.length?nr:1;
  cards.forEach((card,k)=>card.hidden=k!==i-1);pick.value=String(i);prev.disabled=i===1;next.disabled=i===cards.length;window.scrollTo(0,0);}
pick.onchange=()=>location.hash=pick.value;prev.onclick=()=>location.hash=Number(pick.value)-1;next.onclick=()=>location.hash=Number(pick.value)+1;
window.addEventListener('hashchange',render);render();
const zoom=document.querySelector('#zoom'),large=document.querySelector('#large');
document.querySelectorAll('figure img').forEach(img=>{img.tabIndex=0;img.setAttribute('role','button');
  function open(){large.src=img.src;large.alt=img.alt;zoom.showModal();}
  img.onclick=open;img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});
document.querySelector('#close').onclick=()=>zoom.close();
</script></html>
