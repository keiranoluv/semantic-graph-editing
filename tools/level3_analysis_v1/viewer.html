<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 3 · phân tích kết quả</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;background:#f5f6f7;color:#17252d;max-width:1400px;margin:24px auto;padding:0 20px}
h1,h2{line-height:1.3}h2{overflow-wrap:anywhere}a{color:#075bb1}table{border-collapse:collapse;background:white;width:100%;margin:16px 0;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:9px;border-bottom:1px solid #d7dde0}th{background:#e9eef2}

@media(max-width:700px){.pair{grid-template-columns:1fr}body{padding:0 10px}article{padding:12px}table{font-size:12px}th,td{padding:5px}}
</style></head><body>
