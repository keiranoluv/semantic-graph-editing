<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task 3 · Điểm graph và review assistant</title>
<style>
body{font:16px system-ui;margin:24px;background:#f1f5f8;color:#213747}button,select{font:inherit;padding:8px;margin:4px}.pair,.scores{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scores{grid-template-columns:repeat(3,1fr);margin:16px 0}.card,section{background:white;padding:16px;border-radius:10px;min-width:0}.value{font-size:26px;font-weight:650}svg{width:100%}p{line-height:1.55}.muted{color:#526b7c;font-size:14px}.warning{background:#fff5db;padding:12px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}details{margin:12px 0}summary{cursor:pointer}table{width:100%;font-size:14px;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #e4e9ef;text-align:left}.assistant{border-left:4px solid #5466ac;background:#f5f4ff;padding:16px;margin:16px 0}.roi{fill:#e3b31c;fill-opacity:.1;stroke:#d09100;stroke-width:3;stroke-dasharray:8 5;vector-effect:non-scaling-stroke}@media(max-width:800px){body{margin:12px}.pair,.scores{grid-template-columns:1fr}}
</style>
<h1>Task 3 · Điểm graph</h1>
<p class="muted">Điểm từ graph dự đoán, không phải xác suất ảnh đúng. Chỉ kiểm tra loại đối tượng, vùng 2D và phần graph còn lại; màu sắc, chất liệu, tư thế và chi tiết ảnh cần xem trực tiếp. Nhận xét assistant được ghi riêng, chưa phải nhãn tay của bạn.</p>
<nav><button id="previous">Ảnh trước</button><select id="pick" aria-label="Chọn mẫu"></select><button id="next">Ảnh sau</button><select id="filter" aria-label="Lọc mẫu"><option value="all">Tất cả</option><option value="abstained">Chưa đủ bằng chứng</option><option value="reviewed">Có review assistant</option></select></nav>
<p id="coverage"></p><h2 id="title"></h2><p id="prompt"></p><div id="scores" class="scores"></div><div id="notice"></div><main id="images" class="pair"></main><div id="assistant"></div><div id="evidence"></div>
<script id="data" type="application/json">__SCORE_DATA__</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);let visible=DATA.map((_,i)=>i),selected=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>typeof x==='number'?x.toFixed(3):'Chưa đủ bằng chứng';
const reasons={requested_source_object_not_in_graph:'Đối tượng cần sửa không có trong graph nguồn',ambiguous_source_instruction:'Cách mô tả đối tượng nguồn còn mơ hồ',source_anchor_low_confidence:'Đối tượng nguồn có confidence thấp',target_anchor_low_confidence:'Đối tượng ghép ở đích có confidence thấp',ambiguous_edit_anchor_alignment:'Ghép đối tượng cần sửa chưa rõ',ambiguous_new_instance_alignment:'Chưa xác định chắc đối tượng mới',possible_detector_relabel:'Có thể extractor đổi nhãn đối tượng',possible_movement_or_count_instability:'Có thể là di chuyển đối tượng hoặc biến động nhận diện',new_instance_low_confidence:'Đối tượng mới có confidence thấp',ambiguous_preservation_alignment:'Ghép các đối tượng cần bảo toàn còn mơ hồ',no_observable_protected_graph:'Không có phần graph bảo toàn để kiểm tra'};
const assess={appears_satisfied:'Có vẻ đáp ứng',appears_not_satisfied:'Có vẻ chưa đáp ứng',uncertain:'Chưa chắc'};
function picture(c,role){const r=c.roles[role],w=r.image.width,h=r.image.height,b=c.grounding.region;
 let overlay=`<rect class="roi" x="${b[0]*w}" y="${b[1]*h}" width="${(b[2]-b[0])*w}" height="${(b[3]-b[1])*h}"><title>Vùng ý định chỉnh sửa từ ảnh nguồn</title></rect>`;
 const ids=role==='source'?c.scores.affected_source_nodes:c.scores.allowed_new_target_nodes;
 ids.forEach(id=>{const box=r.grounding.nodes[id].bbox_xyxy;overlay+=`<rect x="${box[0]}" y="${box[1]}" width="${box[2]-box[0]}" height="${box[3]-box[1]}" fill="none" stroke="#087d91" stroke-width="4" vector-effect="non-scaling-stroke"><title>${esc(id)}</title></rect>`});
 return `<section><h3>${role==='source'?'Ảnh nguồn':'Ảnh Qwen'}</h3><svg viewBox="0 0 ${w} ${h}" role="img"><image href="${r.preview}" width="${w}" height="${h}"/>${overlay}</svg><details><summary>Graph và confidence</summary><pre>${esc(JSON.stringify({graph:r.graph,grounding:r.grounding},null,2))}</pre></details></section>`;
}
function render(){
 const empty=visible.length===0;document.getElementById('previous').disabled=empty||selected===0;document.getElementById('next').disabled=empty||selected===visible.length-1;
 if(empty){['title','prompt','scores','notice','images','assistant','evidence'].forEach(k=>document.getElementById(k).textContent='');document.getElementById('title').textContent='Không có mẫu phù hợp';return}
 const index=visible[selected],c=DATA[index],s=c.scores;document.getElementById('pick').value=String(index);
 document.getElementById('title').textContent=`${index+1} / ${DATA.length} · ${c.image_id}`;document.getElementById('prompt').textContent=c.prompt;
 document.getElementById('scores').innerHTML=[['Thực hiện thay đổi (graph)',s.edit_score],['Bảo toàn (graph)',s.preservation_score],['Graph Consistency',s.graph_consistency]].map(([name,value])=>`<div class="card">${name}<div class="value">${fmt(value)}</div></div>`).join('');
 document.getElementById('notice').innerHTML=(s.reason_codes.length?`<p class="warning">${s.reason_codes.map(k=>esc(reasons[k]||k)).join(' · ')}. Các điểm thành phần là chẩn đoán, không tự gán PASS/FAIL.</p>`:'')+'<p class="muted">Khung vàng: vùng ý định từ ảnh nguồn. Khung xanh: đối tượng cần sửa / đối tượng mới được graph hỗ trợ.</p>';
 document.getElementById('images').innerHTML=picture(c,'source')+picture(c,'target');
 const a=c.assistant_review;
 document.getElementById('assistant').innerHTML=a?`<section class="assistant"><h3>Review của assistant · không phải nhãn tay</h3><p><b>Đúng yêu cầu:</b> ${assess[a.edit_assessment]} · <b>Bảo toàn:</b> ${assess[a.preservation_assessment]}</p><p>${esc(a.observation_vi)}</p><p><b>Đối chiếu graph:</b> ${esc(a.graph_comment_vi)}</p><p class="muted">${esc(a.limitations_vi||'Đánh giá định tính; cần người dùng xác nhận.')}</p></section>`:'<p class="muted">Mẫu này chưa được assistant review ảnh trực tiếp.</p>';
 const nodeLabel=(role,id)=>c.roles[role].graph.nodes.find(n=>n.id===id)?.label||id;
 document.getElementById('evidence').innerHTML=`<section><h3>Ghép đối tượng nguồn → đích</h3><table><tr><th>Nguồn</th><th>Đích</th><th>IoU</th><th>Mơ hồ</th></tr>${s.alignment.map(a=>`<tr><td>${esc(a.source+' · '+nodeLabel('source',a.source))}</td><td>${esc(a.target+' · '+nodeLabel('target',a.target))}</td><td>${fmt(a.iou)}</td><td>${a.ambiguous?'Có':'Không'}</td></tr>`).join('')}</table><details><summary>Điều kiện edit, node/cạnh mất hoặc thêm, lý do và giới hạn</summary><pre>${esc(JSON.stringify({intent:c.operation,source_grounding:c.grounding,score_evidence:s},null,2))}</pre></details></section>`;
}
function populate(){document.getElementById('pick').innerHTML=visible.map(i=>`<option value="${i}">${i+1} · ${esc(DATA[i].image_id)}</option>`).join('');render()}
document.getElementById('coverage').textContent=`${DATA.filter(c=>c.scores.graph_consistency!==null).length}/${DATA.length} mẫu có điểm tổng xác định · ${DATA.filter(c=>c.assistant_review).length} mẫu có review assistant. Đây không phải tỷ lệ chỉnh sửa đúng.`;
document.getElementById('filter').onchange=e=>{visible=DATA.map((_,i)=>i).filter(i=>e.target.value==='all'||(e.target.value==='abstained'?DATA[i].scores.status==='abstained':DATA[i].assistant_review));selected=0;populate()};
document.getElementById('pick').onchange=e=>{selected=visible.indexOf(Number(e.target.value));render()};
document.getElementById('previous').onclick=()=>{selected=Math.max(0,selected-1);render()};
document.getElementById('next').onclick=()=>{selected=Math.min(visible.length-1,selected+1);render()};populate();
</script></html>
