<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt ảnh Qwen</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 24px auto; padding: 0 20px; max-width: 1500px; font: 16px system-ui; color: #203344; background: #f3f5f7; }
  h1 { font-size: 26px; margin-bottom: 12px; }
  h2 { font-size: 18px; margin-top: 0; }
  .toolbar, .labels { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
  button, select { font: inherit; padding: 9px 12px; border: 1px solid #bbc5ce; border-radius: 6px; background: white; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  #export { background: #234f70; color: white; border-color: #234f70; }
  #saved { color: #526575; font-size: 14px; }
  article { margin: 20px 0; padding: 20px; background: white; border-radius: 10px; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 8px; color: #526575; }
  img { width: 100%; display: block; background: white; }
  .labels { margin-top: 18px; }
  label { display: flex; align-items: center; gap: 10px; }
  @media (max-width: 700px) { body { padding: 0 10px; } .pair { grid-template-columns: 1fr; } }
</style>
<h1>Duyệt ảnh Qwen-Image-2.1</h1>
<div class="toolbar">
  <span id="count" aria-live="polite"></span>
  <button id="export">Tải kết quả JSON</button>
  <button id="previous">Trang trước</button>
  <span id="page"></span>
  <button id="next">Trang sau</button>
</div>
<p id="saved" aria-live="polite"></p>
<main id="cases"></main>
<script id="data" type="application/json">__REVIEW_DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const fields = ['edit_fulfillment', 'preservation'];
const storageKey = 'qwen-only-review-v2:' + DATA.review.results_sha256;
const size = 10;
let start = 0;
let savedText = 'Lựa chọn được lưu trên trình duyệt này. Tải JSON khi duyệt xong.';
const valid = value => value === null || typeof value === 'boolean';
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try {
  const cached = JSON.parse(localStorage.getItem(storageKey));
  if (Array.isArray(cached) && cached.length === DATA.review.reviews.length && cached.every((r, i) =>
      r.task_id === DATA.review.reviews[i].task_id && fields.every(k => valid(r[k])) &&
      (DATA.cases[i].target || fields.every(k => r[k] === null)))) {
    cached.forEach((r, i) => fields.forEach(k => DATA.review.reviews[i][k] = r[k]));
  }
} catch (_) { savedText = 'Trình duyệt không lưu được lựa chọn. Hãy tải JSON trước khi đóng trang.'; }
function syncStatus() {
  DATA.review.reviews.forEach(r => {
    r.status = fields.every(k => typeof r[k] === 'boolean') ? 'reviewed' : 'pending';
  });
  document.getElementById('count').textContent = `Đã chấm ${DATA.review.reviews.filter(r => r.status === 'reviewed').length} / ${DATA.cases.length}`;
  document.getElementById('saved').textContent = savedText;
}
function render() {
  syncStatus();
  document.getElementById('page').textContent = `${start + 1}–${Math.min(start + size, DATA.cases.length)} / ${DATA.cases.length}`;
  document.getElementById('previous').disabled = start === 0;
  document.getElementById('next').disabled = start + size >= DATA.cases.length;
  document.getElementById('cases').innerHTML = DATA.cases.slice(start, start + size).map((c, j) => {
    const i = start + j, r = DATA.review.reviews[i];
    return `<article data-task="${esc(c.task_id)}"><h2>Ảnh ${i + 1}</h2><p>${esc(c.prompt)}</p>
      <div class="pair"><figure><figcaption>Ảnh nguồn</figcaption><img src="${c.source}" alt="Ảnh nguồn ${i + 1}"></figure>
      <figure><figcaption>Ảnh Qwen</figcaption>${c.target ? `<img src="${c.target}" alt="Ảnh Qwen ${i + 1}">` : '<p>Chưa có ảnh đích để duyệt.</p>'}</figure></div>
      <div class="labels">${fields.map(k => `<label>${k === 'edit_fulfillment' ? 'Đúng yêu cầu' : 'Bảo toàn'}
        <select data-i="${i}" data-k="${k}" ${c.target ? '' : 'disabled'}>
          ${[['', 'Chưa chấm'], ['true', 'Đạt'], ['false', 'Không đạt']].map(([v, label]) => `<option value="${v}" ${(r[k] === null ? '' : String(r[k])) === v ? 'selected' : ''}>${label}</option>`).join('')}
        </select></label>`).join('')}</div></article>`;
  }).join('');
}
document.getElementById('cases').onchange = event => {
  const { i, k } = event.target.dataset;
  if (i === undefined || !fields.includes(k)) return;
  DATA.review.reviews[i][k] = event.target.value === '' ? null : event.target.value === 'true';
  try { localStorage.setItem(storageKey, JSON.stringify(DATA.review.reviews)); }
  catch (_) { savedText = 'Trình duyệt không lưu được lựa chọn. Hãy tải JSON trước khi đóng trang.'; }
  syncStatus();
};
document.getElementById('previous').onclick = () => { start = Math.max(0, start - size); render(); };
document.getElementById('next').onclick = () => { if (start + size < DATA.cases.length) start += size; render(); };
document.getElementById('export').onclick = () => {
  syncStatus();
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([JSON.stringify(DATA.review, null, 2)], {type: 'application/json'}));
  link.download = DATA.download;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
};
render();
</script>
</html>
