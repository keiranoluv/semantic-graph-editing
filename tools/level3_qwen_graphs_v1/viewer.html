<!doctype html><html lang="vi">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REACT++ · Graph nguồn và đích</title>
<style>
body{font:16px system-ui;margin:24px;color:#213747;background:#f1f5f8}button,select{font:inherit;padding:8px;margin:4px}.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}section{background:white;padding:16px;border-radius:10px;min-width:0}svg{width:100%;display:block}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px;border-bottom:1px solid #dde6ec}p{line-height:1.5}.muted{color:#576e7e;font-size:14px}.error{color:#a92828}details{margin-top:16px}summary{cursor:pointer}.scene .box{fill:none;stroke-width:3;vector-effect:non-scaling-stroke}.scene.hide-boxes .overlay{display:none}.graphs{border-top:1px solid #e8eef3;margin-top:16px}.obj:hover{background:#eaf3fb}@media(max-width:800px){body{margin:12px}.pair{grid-template-columns:1fr}}
</style>
<h1>REACT++ · Graph nguồn và đích</h1>
<p class="muted">Graph dự đoán, chưa phải ground truth. ID node chỉ có ý nghĩa trong từng ảnh; cùng ID ở hai ảnh chưa có nghĩa là cùng đối tượng. Mô hình không dự đoán thuộc tính.</p>
<nav><button id="previous">Ảnh trước</button><select id="pick" aria-label="Chọn cặp ảnh"></select><button id="next">Ảnh sau</button><button id="boxes">Ẩn bounding box</button></nav>
<h2 id="title"></h2><p id="prompt"></p><main class="pair" id="pair"></main>
<script id="data" type="application/json">__GRAPH_DATA__</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
let selected=0,showBoxes=true;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const score=x=>typeof x==='number'?x.toFixed(3):'—';
const color=i=>`hsl(${(i*137.5)%360},75%,37%)`;
function picture(r){
 const w=r.image.width||1000,h=r.image.height||750;
 const overlays=(r.graph?.nodes||[]).map((n,i)=>{const b=r.grounding.nodes[n.id].bbox_xyxy;return `<g class="overlay"><rect class="box" x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}" stroke="${color(i)}"><title>${esc(n.id+' · '+n.label)}</title></rect><text x="${b[0]+3}" y="${Math.max(w/60,b[1]+w/60)}" font-size="${w/60}" fill="${color(i)}" stroke="white" stroke-width="${w/500}" paint-order="stroke">${esc(n.id+' · '+n.label)}</text></g>`}).join('');
 return `<svg class="scene ${showBoxes?'':'hide-boxes'}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Ảnh và bounding box"><image href="${r.preview}" width="${w}" height="${h}"/>${overlays}</svg>`;
}
function graph(r,role){
 const nodes=r.graph.nodes,edges=r.graph.edges;
 if(!nodes.length)return '<p>Không có node được dự đoán.</p>';
 const h=Math.max(360,nodes.length*24),pos={};
 nodes.forEach((n,i)=>pos[n.id]=[320+210*Math.cos(2*Math.PI*i/nodes.length),h/2+(h/2-45)*Math.sin(2*Math.PI*i/nodes.length)]);
 let svg=`<svg class="graphs" viewBox="0 0 640 ${h}" role="img" aria-label="Đồ thị có hướng"><defs><marker id="arrow-${role}" markerWidth="9" markerHeight="7" refX="19" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5z" fill="#657f91"/></marker></defs>`;
 edges.forEach(e=>{const [x1,y1]=pos[e.subject],[x2,y2]=pos[e.object];svg+=`<g><title>${esc(e.subject+' → '+e.predicate+' → '+e.object)}</title><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#657f91" opacity=".6" marker-end="url(#arrow-${role})"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2}" font-size="10" fill="#314c60" paint-order="stroke" stroke="white" stroke-width="3">${esc(e.predicate)}</text></g>`});
 nodes.forEach((n,i)=>{const [x,y]=pos[n.id];svg+=`<g><circle cx="${x}" cy="${y}" r="16" fill="${color(i)}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" fill="white">${esc(n.id)}</text><text x="${x}" y="${y+31}" text-anchor="middle" font-size="12" fill="#213747">${esc(n.label)}</text></g>`});
 return svg+'</svg>';
}
function panel(r,role){
 let html=`<section data-role="${role}"><h2>${role==='source'?'Ảnh nguồn':'Ảnh Qwen'}</h2>${picture(r)}`;
 if(!r.graph)return html+`<p class="error">Graph chưa có: ${esc(r.status)} ${esc(r.error||'')}</p></section>`;
 const labels=Object.fromEntries(r.graph.nodes.map(n=>[n.id,n.label]));
 html+=graph(r,role);
 html+='<details><summary>Đối tượng, confidence và bounding box</summary><table><thead><tr><th>Node</th><th>Confidence</th><th>Box (xyxy)</th></tr></thead><tbody>';
 html+=r.graph.nodes.map(n=>{const g=r.grounding.nodes[n.id];return `<tr class="obj"><td>${esc(n.id+' · '+n.label)}</td><td>${score(g.confidence)}</td><td>${g.bbox_xyxy.map(v=>v.toFixed(1)).join(', ')}</td></tr>`}).join('')+'</tbody></table></details>';
 html+='<details open><summary>Quan hệ có hướng</summary><table><thead><tr><th>Chủ thể → quan hệ → đối tượng</th><th>Relation / triplet confidence</th></tr></thead><tbody>';
 html+=r.graph.edges.map(e=>{const g=r.grounding.edges[e.id];return `<tr><td>${esc(e.subject+' '+labels[e.subject])} → <b>${esc(e.predicate)}</b> → ${esc(e.object+' '+labels[e.object])}</td><td>${score(g.confidence)} / ${score(g.triplet_confidence)}</td></tr>`}).join('');
 return html+'</tbody></table></details><p class="muted">Confidence là score của mô hình, chưa hiệu chỉnh trên bộ ảnh này.</p></section>';
}
function render(){
 const c=DATA[selected];
 document.getElementById('title').textContent=`${selected+1} / ${DATA.length} · ${c.image_id}`;
 document.getElementById('prompt').textContent=c.prompt;
 document.getElementById('pick').value=String(selected);
 document.getElementById('previous').disabled=selected===0;
 document.getElementById('next').disabled=selected===DATA.length-1;
 document.getElementById('pair').innerHTML=panel(c.roles.source,'source')+panel(c.roles.target,'target');
}
document.getElementById('pick').innerHTML=DATA.map((c,i)=>`<option value="${i}">${i+1} · ${esc(c.image_id)}</option>`).join('');
document.getElementById('pick').onchange=e=>{selected=Number(e.target.value);render()};
document.getElementById('previous').onclick=()=>{selected=Math.max(0,selected-1);render()};
document.getElementById('next').onclick=()=>{selected=Math.min(DATA.length-1,selected+1);render()};
document.getElementById('boxes').onclick=()=>{showBoxes=!showBoxes;document.getElementById('boxes').textContent=showBoxes?'Ẩn bounding box':'Hiện bounding box';document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('hide-boxes',!showBoxes))};
render();
</script></html>
